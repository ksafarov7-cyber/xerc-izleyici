<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Xərclər">
<meta name="theme-color" content="#eef1f4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Xərc İzləyici</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202B;--mute:#6b7885;--line:#dde3e8;--pos:#0B7A5C;--neg:#C2410C;--acc:#14202B;--onacc:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e141a;--card:#18212a;--ink:#eaf0f5;--mute:#8a98a6;--line:#27323d;--pos:#34d399;--neg:#fb923c;--acc:#eaf0f5;--onacc:#0e141a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px);max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero{padding:8px 4px 20px}
.hero small{color:var(--mute);font-size:14px}
.hero .big{font-size:46px;font-weight:700;line-height:1.1;margin:2px 0 10px}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--mute)}
.hero .sub b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.daily h3{margin:0 0 2px;font-size:15px}.daily p{margin:0 0 10px;color:var(--mute);font-size:13px}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.drow .v{font-size:22px;font-weight:700;color:var(--pos)}.drow .v small{font-size:12px;color:var(--mute);font-weight:500}
h2{font-size:13px;color:var(--mute);font-weight:600;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
h2 button{background:none;border:0;color:var(--ink);font:600 14px inherit;padding:4px 0}
.acc{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.acc:first-child{border-top:0}.acc .n{font-weight:600}.acc .t{font-size:12px;color:var(--mute)}
.acc .b{font-weight:700;font-size:17px}.pos{color:var(--pos)}.neg{color:var(--neg)}
.mv{display:flex;gap:6px}.mv button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font-size:16px}.mv button:disabled{opacity:.3}
h2 span{display:flex;gap:16px}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:13px}.seg .on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chips button{padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--ink);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wd{display:flex;flex-wrap:wrap;gap:0 14px}[hidden]{display:none!important}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mute)}.sum b{font-size:20px}
.ops{display:flex;gap:8px;margin-top:8px}.ops button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);font-weight:600;padding-bottom:6px}.dayh b{font-weight:700;font-size:14px}.dayh+.tx{border-top:0}
.pnav{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}.pnav button{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}.pnav button:disabled{opacity:.3}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.tx{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tx{cursor:pointer}.tx:first-child{border-top:0}.tx .m{color:var(--mute);font-size:12px}.tx button{background:none;border:0;color:var(--mute);font-size:18px;padding:0 4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--acc);color:var(--onacc);border:0;border-radius:30px;padding:15px 30px;font:600 16px inherit;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:9}
.sheet[hidden]{display:none}
.box{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media(prefers-reduced-motion:reduce){.box{animation:none}}
.box h3{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:16px inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--ink);font-size:15px}.chk input{width:20px;height:20px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:600 14px inherit}
.tabs button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn{width:100%;margin-top:16px;padding:14px;border-radius:14px;border:0;background:var(--acc);color:var(--onacc);font:600 16px inherit}
.btn.alt{background:none;color:var(--neg);margin-top:4px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.foot{display:flex;gap:10px;margin-top:24px}.foot button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--mute);font:14px inherit}
.srch{position:relative}.srch input{padding-right:42px}.srch button{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);font-size:18px;padding:10px 12px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tpl{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.tpl b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tpl .num{font-weight:700;color:var(--neg);font-size:18px}.tpl small{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl:active{transform:scale(.97)}.tpls.ed .tpl{border-style:dashed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--acc);color:var(--onacc);border-radius:14px;padding:11px 16px;display:flex;gap:16px;align-items:center;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;font:700 14px inherit;text-decoration:underline;padding:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 0}.bar i{display:block;height:100%;border-radius:3px;min-width:2px}.bar.p i{background:var(--mute);opacity:.5}
.cmp{padding:10px 0;border-top:1px solid var(--line)}.cmp .cn{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin-bottom:2px}.cmp .cv{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
.ins{display:flex;gap:8px;font-size:14px;padding:5px 0}.ins b{flex:none;width:16px;text-align:center}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:12px 0 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--ink)}.leg i.p{background:var(--mute);opacity:.5}
body{overflow-x:clip}
@keyframes sl{from{transform:translateX(28px);opacity:.35}}@keyframes sr{from{transform:translateX(-28px);opacity:.35}}
#app.sl{animation:sl .2s ease-out}#app.sr{animation:sr .2s ease-out}
@media(prefers-reduced-motion:reduce){#app.sl,#app.sr{animation:none}}
.box{overscroll-behavior:contain}.box::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 14px}
.warn{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--neg);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:13px}
.warn button{background:#fff;color:var(--neg);border:0;border-radius:10px;padding:7px 12px;font:700 13px inherit;flex:none}
:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" onclick="openOp('spend')">+ Əməliyyat</button>
<div class="toast" id="toast" hidden></div>
<div class="warn" id="warn" hidden><span>Data yadda saxlanmadı! Nüsxə al, yoxsa itə bilər.</span><button onclick="exportD()">Nüsxə al</button></div>
<div class="sheet" id="sheet" hidden onclick="if(event.target===this)closeS()"><div class="box" id="box"></div></div>

<script>
const K='xerc-izleyici-v1';
const $=s=>document.querySelector(s);
let saveBad=false;
const warn=on=>{const e=document.getElementById('warn');if(e)e.hidden=!on};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));if(saveBad){saveBad=false;warn(0)}return true}catch(e){saveBad=true;warn(1);return false}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=n=>Math.round(n*100)/100;
// mənfi işarəsi göstərilmir: qırmızı rəng = xərc/borc
const fmt=n=>r2(Math.abs(n)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g,' ')+' ₼';
const fmtS=n=>(r2(n)<0?'−':'')+fmt(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function evalExpr(v){
  const e=String(v).replace(/,/g,'.').replace(/[×x*]/gi,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/\s/g,'');
  if(!e||!/^[0-9+\-*/.()]+$/.test(e))return null;
  try{const r=Function('"use strict";return ('+e+')')();return Number.isFinite(r)?Math.round(r*100)/100:null}catch(x){return null}
}
const num=evalExpr;
function calc(el){const v=evalExpr(el.value);if(v!==null&&/[+*/×÷x−–]|.-/.test(el.value.trim()))el.value=v}
function ins(id,o){const i=document.getElementById(id);i.value+=o;i.focus()}
const amtF=(id,val,ph)=>`<input id="${id}" inputmode="decimal" autocomplete="off" value="${val}" placeholder="${ph||'0.00'}" onblur="calc(this)"><div class="ops">${['+','−','×','÷'].map(o=>`<button type="button" onclick="ins('${id}','${o}')">${o}</button>`).join('')}</div>`;
function norm(d){
  d.rules=d.rules||[];d.tpls=d.tpls||[];d.last=d.last||{};d.cats=d.cats||['Transport','Yemək və içmək','Ev','Geyim','Digər'];if(d.v===2)return d;
  const ng=new Set(d.acc.filter(a=>a.type==='exp').map(a=>a.id));
  d.acc.forEach(a=>{if(ng.has(a.id))a.balance=-a.balance;delete a.type});
  d.tx.forEach(t=>{for(const k in t.deltas)if(ng.has(k))t.deltas[k]=-t.deltas[k]});
  d.v=2;return d;
}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=norm(S||{acc:[],tx:[],v:2});save();
const A=id=>S.acc.find(a=>a.id===id);
const total=l=>l.reduce((s,a)=>s+a.balance,0);
function daysLeft(){const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1}

const isB=a=>a.kind==='b';
let sortMode=false,tplEd=false,view='home',F={type:'all',cat:'all',from:'',to:'',q:''};
const WD=[['B.e',1],['Ç.a',2],['Çər',3],['C.a',4],['Cüm',5],['Şən',6],['Baz',0]];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const txKind=t=>t.kind||(t.sign==='+'?'add':t.sign==='−'?'spend':'move');
const catOf=t=>t.cat||(txKind(t)==='spend'?'Digər':'');
const seg=()=>`<div class="seg">${[['home','Ana səhifə'],['tx','Əməliyyatlar'],['stat','Statistika'],['set','⚙︎']].map(v=>`<button class="${view===v[0]?'on':''}" ${v[0]==='set'?'style="flex:0 0 46px" aria-label="Tənzimləmələr"':''} onclick="setView('${v[0]}')">${v[1]}</button>`).join('')}</div>`;
const VW=['home','tx','stat','set'];
function anim(d){if(!d)return;const a=$('#app');a.classList.remove('sl','sr');void a.offsetWidth;a.classList.add(d>0?'sl':'sr');try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function setView(v){const d=VW.indexOf(v)-VW.indexOf(view);view=v;render();scrollTo(0,0);anim(d)}
function setF(k,v){F[k]=v;render()}
function clearF(){F={type:'all',cat:'all',from:'',to:'',q:''};render()}
function quick(k){const n=new Date(),t=ymd(n);
  if(k==='today')F.from=F.to=t;
  else if(k==='week'){const x=new Date(n);x.setDate(n.getDate()-((n.getDay()+6)%7));F.from=ymd(x);F.to=t}
  else{F.from=ymd(new Date(n.getFullYear(),n.getMonth(),1));F.to=t}
  render()}
const txRow=t=>{const k=txKind(t),c=catOf(t);return `<div class="tx" onclick="openTxEdit('${t.id}')"><div><div>${esc(t.label)}</div><div class="m">${new Date(t.d).toLocaleString('az',t.auto?{day:'numeric',month:'short'}:{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${c?' · '+esc(c):''}${t.auto?' · avtomatik':''}</div></div><div style="display:flex;align-items:center"><span class="num ${k==='add'?'pos':k==='spend'?'neg':''}">${k==='add'?'+':''}${fmt(t.amt)}</span></div></div>`};
function dayGroups(l){
  if(!l.length)return '<div class="card"><div class="empty">Bu filtrə uyğun əməliyyat yoxdur.</div></div>';
  const g=[];[...l].sort((a,b)=>b.d-a.d).slice(0,300).forEach(t=>{const k=ymd(new Date(t.d));let x=g[g.length-1];if(!x||x.k!==k){x={k,l:[]};g.push(x)}x.l.push(t)});
  return g.map(x=>{
    const n=r2(x.l.reduce((s,t)=>{const k=txKind(t);return s+(k==='add'?t.amt:k==='spend'?-t.amt:0)},0)),[y,m,d]=x.k.split('-');
    const tag=n<0?`<b class="num neg">Xərclənib ${fmt(n)}</b>`:n>0?`<b class="num pos">Gəlir ${fmt(n)}</b>`:'';
    return `<div class="card"><div class="dayh"><span>${d}.${m}.${y}</span>${tag}</div>${x.l.map(txRow).join('')}</div>`}).join('');
}
const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ə/g,'e').replace(/ı/g,'i');
const KN={add:'elave gelir',spend:'xerc',move:'transfer kocurme'};
// axtarış: hər söz ayrıca yoxlanır (hamısı uyğun gəlməlidir). Rəqəm → məbləğ, qeyd/ad, tarix; mətn → qeyd, kateqoriya, növ, ay adı
function matchQ(t,q){
  const toks=fold(q).replace(/,/g,'.').split(/\s+/).filter(Boolean);
  if(!toks.length)return true;
  const d=new Date(t.d),ds=dmy(d),am=[String(t.amt),r2(t.amt).toFixed(2)],
  hay=fold(t.label+' '+catOf(t)+' '+KN[txKind(t)]+' '+(t.auto?'avtomatik ':'')+MON[d.getMonth()]);
  return toks.every(k=>/^[\d.]+$/.test(k)?(am.some(x=>x.includes(k))||hay.includes(k)||(k.includes('.')&&ds.includes(k))):hay.includes(k));
}
function txList(){
  const ds=t=>ymd(new Date(t.d));
  const l=S.tx.filter(t=>(F.type==='all'||txKind(t)===F.type)&&(F.cat==='all'||catOf(t)===F.cat)&&(!F.from||ds(t)>=F.from)&&(!F.to||ds(t)<=F.to)&&(!F.q||matchQ(t,F.q)));
  const sp=l.filter(t=>txKind(t)==='spend').reduce((a,t)=>a+t.amt,0);
  return `<div class="card sum"><span>${l.length} əməliyyat</span><span>Xərc cəmi <b class="num ${sp?'neg':''}">${fmt(sp)}</b></span></div>${dayGroups(l)}`;
}
function updTx(v){F.q=v;$('#txres').innerHTML=txList();$('#qx').hidden=!v}
function clearQ(){const i=$('#q');i.value='';updTx('');i.focus()}
function renderTx(){
  const so=(v,c,txt)=>`<option value="${v}" ${c===v?'selected':''}>${txt}</option>`;
  $('#app').innerHTML=seg()+`<div class="card"><div class="srch"><input id="q" type="text" enterkeyhint="search" autocomplete="off" placeholder="Axtar: qeyd, məbləğ, kateqoriya, tarix" value="${esc(F.q)}" oninput="updTx(this.value)"><button type="button" id="qx" onclick="clearQ()" ${F.q?'':'hidden'} aria-label="Axtarışı təmizlə">✕</button></div>
  <label>Növ</label><select onchange="setF('type',this.value)">${so('all',F.type,'Hamısı')}${so('add',F.type,'Əlavə')}${so('spend',F.type,'Xərc')}${so('move',F.type,'Transfer')}</select>
  <label>Kateqoriya</label><select onchange="setF('cat',this.value)">${so('all',F.cat,'Hamısı')}${S.cats.map(c=>so(c,F.cat,c)).join('')}</select>
  <div class="two"><div><label>Başlanğıc tarix</label><input type="date" value="${F.from}" onchange="setF('from',this.value)"></div><div><label>Son tarix</label><input type="date" value="${F.to}" onchange="setF('to',this.value)"></div></div>
  <div class="chips"><button onclick="quick('today')">Bu gün</button><button onclick="quick('week')">Bu həftə</button><button onclick="quick('month')">Bu ay</button><button onclick="clearF()">Təmizlə</button></div></div>
  <div id="txres">${txList()}</div>`;
}
let ST={p:'month',off:0},lastRows=[];
const MON=['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
const PAL=['#0B7A5C','#2F6FDE','#E08A00','#C2410C','#8B5CF6','#0EA5A5','#D6336C','#6B7885','#84A512','#B45309'];
const dmy=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
function setP(p){ST={p,off:0};render()}
function stepP(d){const o=Math.min(0,ST.off+d);if(o===ST.off)return;ST.off=o;render();anim(d)}
function prangeAt(o){
  const n=new Date();let a,b,label;
  if(ST.p==='day'){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()+o);b=a;label=dmy(a)}
  else if(ST.p==='week'){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)+7*o);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);label=dmy(a).slice(0,5)+' – '+dmy(b)}
  else{a=new Date(n.getFullYear(),n.getMonth()+o,1);b=new Date(a.getFullYear(),a.getMonth()+1,0);label=MON[a.getMonth()]+' '+a.getFullYear()}
  return{from:ymd(a),to:ymd(b),label};
}
const prange=()=>prangeAt(ST.off);
const pdate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
// əvvəlki dövr; cari dövr hələ bitməyibsə, ədalətli olsun deyə əvvəlkinin eyni qədər günü götürülür
function prevRange(){
  const q=prangeAt(ST.off-1);q.cut=0;
  if(ST.off===0&&ST.p!=='day'){
    const n=Math.round((pdate(ymd(new Date()))-pdate(prangeAt(0).from))/864e5)+1,f=pdate(q.from),e=ymd(new Date(f.getFullYear(),f.getMonth(),f.getDate()+n-1));
    if(e<q.to){q.to=e;q.cut=n}
  }
  return q;
}
function spendBy(from,to){
  const m={};
  S.tx.forEach(t=>{if(txKind(t)!=='spend')return;const k=ymd(new Date(t.d));if(k<from||k>to)return;const c=catOf(t);m[c]=r2((m[c]||0)+t.amt)});
  return m;
}
function dlt(c,p){
  if(!c&&!p)return null;
  if(!p)return{cls:'neg',txt:'yeni',arr:'↑'};
  const pc=Math.round((c-p)/p*100);
  if(pc===0)return{cls:'',txt:'eyni',arr:'＝'};
  return{cls:pc>0?'neg':'pos',txt:(pc>0?'↑ ':'↓ ')+Math.abs(pc)+'%',arr:pc>0?'↑':'↓'};
}
function cmpHtml(r,pr,cur,prev,col){
  const tot=r2(Object.values(cur).reduce((x,y)=>x+y,0)),ptot=r2(Object.values(prev).reduce((x,y)=>x+y,0)),P=ST.p,now=ST.off===0;
  const ref=(now?{day:'dünənə',week:'keçən həftəyə',month:'keçən aya'}:{day:'əvvəlki günə',week:'əvvəlki həftəyə',month:'əvvəlki aya'})[P];
  const vs=(now?{day:'Dünənlə',week:'Keçən həftə ilə',month:'Keçən ayla'}:{day:'Əvvəlki gün ilə',week:'Əvvəlki həftə ilə',month:'Əvvəlki ayla'})[P];
  const nm=now?{day:['Bu gün','Dünən'],week:['Bu həftə','Keçən həftə'],month:['Bu ay','Keçən ay']}[P]:[r.label,pr.label];
  if(!ptot)return `<div class="card"><div class="empty">Müqayisə üçün əvvəlki dövrdə (${esc(nm[1])}) xərc yoxdur.</div></div>`;
  const note=pr.cut?`<div class="note" style="margin:0 0 6px">Bu ${P==='week'?'həftə':'ay'} hələ bitməyib, ona görə ${P==='week'?'keçən həftənin':'keçən ayın'} ilk ${pr.cut} günü ilə müqayisə olunur.</div>`:'';
  const names=[...new Set([...Object.keys(cur),...Object.keys(prev)])].map(n=>[n,cur[n]||0,prev[n]||0]).sort((a,b)=>Math.abs(b[1]-b[2])-Math.abs(a[1]-a[2]));
  const sent=(n,c,p)=>{const d=dlt(c,p);
    if(!p)return `${esc(n)} kateqoriyasında əvvəl xərc olmayıb, indi ${fmt(c)} xərclənib`;
    if(!c)return `${esc(n)} kateqoriyasında bu dövrdə xərc yoxdur (əvvəl ${fmt(p)} idi)`;
    const pc=Math.round(Math.abs(c-p)/p*100);
    return `${esc(n)} kateqoriyasında ${ref} nisbətən ${pc}% ${c>p?'çox':'az'} xərcləmisiniz`};
  const lines=[];
  const td=dlt(tot,ptot),tp=Math.round(Math.abs(tot-ptot)/ptot*100);
  lines.push(`<div class="ins"><b class="${td.cls}">${td.arr}</b><span>${tp===0?`Ümumi xərcləriniz ${ref} nisbətən demək olar ki, eynidir`:`Ümumi xərcləriniz ${ref} nisbətən <b class="${td.cls}" style="display:inline;width:auto">${tp}% ${tot>ptot?'çoxdur':'azdır'}</b>`}</span></div>`);
  names.filter(x=>dlt(x[1],x[2]).txt!=='eyni').slice(0,3).forEach(x=>{const d=dlt(x[1],x[2]);lines.push(`<div class="ins"><b class="${d.cls}">${d.arr}</b><span>${sent(x[0],x[1],x[2])}</span></div>`)});
  const crow=(n,c,p,color)=>{const d=dlt(c,p),mx=Math.max(c,p)||1;return `<div class="cmp"><div class="cn"><span>${esc(n)}</span><b class="num ${d?d.cls:''}">${d?d.txt:''}</b></div><div class="bar"><i style="width:${c/mx*100}%;background:${color}"></i></div><div class="bar p"><i style="width:${p/mx*100}%"></i></div><div class="cv num"><span>${fmt(c)}</span><span>${fmt(p)}</span></div></div>`};
  return `<div class="card"><h3 style="margin:0 0 6px;font-size:15px">${vs} müqayisə</h3>${note}${lines.join('')}
  <div class="leg"><span><i></i>${esc(nm[0])}</span><span><i class="p"></i>${esc(nm[1])}</span></div>
  ${crow('Cəmi',tot,ptot,'var(--ink)')}${names.map(x=>crow(x[0],x[1],x[2],col(x[0]))).join('')}</div>`;
}
function renderStat(){
  const r=prange(),pr=prevRange(),cur=spendBy(r.from,r.to),prev=spendBy(pr.from,pr.to);
  const rows=lastRows=Object.entries(cur).sort((a,b)=>b[1]-a[1]),tot=rows.reduce((x,y)=>x+y[1],0);
  const col=c=>{const i=S.cats.indexOf(c);return PAL[(i<0?7:i)%PAL.length]};
  let cum=0;
  const arcs=rows.map(([c,v])=>{const q=v/tot*100,e=`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${col(c)}" stroke-width="7" stroke-dasharray="${q} ${100-q}" stroke-dashoffset="${25-cum}"/>`;cum+=q;return e}).join('');
  const P=[['day','Gün'],['week','Həftə'],['month','Ay']];
  let h=seg()+`<div class="seg">${P.map(x=>`<button class="${ST.p===x[0]?'on':''}" onclick="setP('${x[0]}')">${x[1]}</button>`).join('')}</div>
  <div data-sw="p"><div class="pnav"><button onclick="stepP(-1)" aria-label="Əvvəlki">‹</button><b>${r.label}</b><button onclick="stepP(1)" ${ST.off>=0?'disabled':''} aria-label="Sonrakı">›</button></div>`;
  if(!rows.length)h+=`<div class="card"><div class="empty">Bu dövrdə xərc yoxdur.</div></div></div>`;
  else h+=`<div class="card"><svg viewBox="0 0 42 42" width="230" height="230" style="display:block;margin:4px auto"><circle cx="21" cy="21" r="15.915" fill="none" style="stroke:var(--line)" stroke-width="7"/>${arcs}<text x="21" y="20" text-anchor="middle" font-size="2.6" style="fill:var(--mute)">Xərc cəmi</text><text x="21" y="24.5" text-anchor="middle" font-size="3.6" font-weight="700" style="fill:var(--ink)">${fmt(tot)}</text></svg>
  <div class="note" style="text-align:center">Ən çox: ${esc(rows[0][0])}</div></div></div>`;
  h+=cmpHtml(r,pr,cur,prev,col);
  if(rows.length)h+=`<div class="card">`+rows.map((x,i)=>`<div class="acc" onclick="goCat(${i})"><div style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:${col(x[0])}"></span><div><div class="n">${esc(x[0])}</div><div class="t">${(x[1]/tot*100).toFixed(1)}%</div></div></div><div class="b num neg">${fmt(x[1])}</div></div>`).join('')+`</div>`;
  $('#app').innerHTML=h;
}
function goCat(i){const r=prange();F={type:'spend',cat:lastRows[i][0],from:r.from,to:r.to,q:''};view='tx';render();scrollTo(0,0)}

function renderSet(){
  $('#app').innerHTML=seg()+`<h2>Kateqoriyalar <button onclick="openCat()">+ Yeni</button></h2><div class="card">`+S.cats.map((c,i)=>`<div class="acc" onclick="openCat(${i})"><div><div class="n">${esc(c)}</div><div class="t">${S.tx.filter(t=>catOf(t)===c).length} xərc</div></div><div class="t">›</div></div>`).join('')+`</div>
  <h2>Data</h2><div class="card"><div class="acc" onclick="exportD()"><div class="n">Nüsxə al</div></div><div class="acc" onclick="importD()"><div class="n">Nüsxəni yüklə</div></div><div class="acc" onclick="resetAll()"><div class="n neg">Bütün datanı sil</div></div></div>`;
}
function openCat(i){
  const c=i===undefined?'':S.cats[i],fix=c==='Digər';
  openS(`<h3>${i===undefined?'Yeni kateqoriya':esc(c)}</h3><label>Ad</label><input id="c-name" value="${esc(c)}" ${fix?'disabled':''}>
  ${fix?'<div class="note">"Digər" standart kateqoriyadır, dəyişdirilmir və silinmir. Silinən kateqoriyaların xərcləri ona keçir.</div>':`<button class="btn" onclick="saveCat(${i===undefined?-1:i})">Yadda saxla</button>`}
  ${i!==undefined&&!fix?`<button class="btn alt" onclick="delCat(${i})">Sil</button>`:''}`);
}
function saveCat(i){
  const n=$('#c-name').value.trim();
  if(!n)return alert('Ad yaz.');
  if(S.cats.some((c,j)=>j!==i&&c.toLowerCase()===n.toLowerCase()))return alert('Belə kateqoriya var.');
  if(i<0)S.cats.splice(S.cats.length-1,0,n);
  else{const o=S.cats[i];S.cats[i]=n;S.tx.forEach(t=>{if(t.cat===o)t.cat=n});S.rules.forEach(r=>{if(r.cat===o)r.cat=n});S.tpls.forEach(r=>{if(r.cat===o)r.cat=n});F.cat==='all'||F.cat!==o||(F.cat=n)}
  save();closeS();render();
}
function delCat(i){
  const o=S.cats[i];
  if(!confirm(`"${o}" silinsin? Bu kateqoriyanın xərcləri "Digər"ə keçəcək.`))return;
  S.tx.forEach(t=>{if(t.cat===o)t.cat='Digər'});S.rules.forEach(r=>{if(r.cat===o)r.cat='Digər'});S.tpls.forEach(r=>{if(r.cat===o)r.cat='Digər'});
  S.cats.splice(i,1);if(F.cat===o)F.cat='all';save();closeS();render();
}
function resetAll(){
  if(!confirm('BÜTÜN data silinsin? Bunu geri qaytarmaq olmaz.')||!confirm('Əminsən? Əvvəlcə nüsxə almaq məsləhətdir.'))return;
  S=norm({acc:[],tx:[],rules:[],v:2});save();view='home';render();
}
function sched(r){return r.freq==='daily'?'hər gün':r.freq==='weekly'?'həftədə: '+WD.filter(w=>r.days.includes(w[1])).map(w=>w[0]).join(', '):'hər ayın '+r.dom+'-i'}
const rulesHtml=()=>`<h2>Avtomatik xərclər <button onclick="openRule()">+ Yeni</button></h2><div class="card">`+(S.rules.map(r=>`<div class="acc" onclick="openRuleEdit('${r.id}')"><div><div class="n">${esc(r.name)}</div><div class="t">${sched(r)} · ${esc(r.cat)}</div></div><div class="b num neg">${fmt(r.amt)}</div></div>`).join('')||`<div class="empty">Məsələn: hər gün Transport 2.40 ₼.</div>`)+`</div>`;
function openRule(){
  const R=S.acc.filter(a=>!isB(a)),B=S.acc.filter(isB);
  if(!R.length)return alert('Əvvəlcə pul hesabı yarat.');
  openS(`<h3>Yeni avtomatik xərc</h3>
  <label>Ad</label><input id="r-name" placeholder="Məs: Avtobus">
  <label>Məbləğ</label>${amtF('r-amt','','2.40')}
  <label>Kateqoriya</label><select id="r-cat">${S.cats.map(c=>`<option>${c}</option>`).join('')}</select>
  <label>Hansı hesabdan</label><select id="r-acc">${opts(R)}</select>
  <label>Xərc büdcəsindən də çıx</label><select id="r-bud"><option value="">Yox</option>${opts(B,(B[0]||{}).id)}</select>
  <label>Təkrar</label><select id="r-freq" onchange="rf()"><option value="daily">Hər gün</option><option value="weekly">Həftənin seçdiyim günləri</option><option value="monthly">Ayın müəyyən günü</option></select>
  <div id="r-w" class="wd" hidden>${WD.map(w=>`<label class="chk"><input type="checkbox" value="${w[1]}"> ${w[0]}</label>`).join('')}</div>
  <div id="r-m" hidden><label>Ayın neçənci günü</label><input id="r-dom" inputmode="numeric" value="1"></div>
  <div class="note">Tətbiq açılanda keçən günlərin xərcləri də avtomatik əlavə olunur. Lazım olmayanı əməliyyatlardan silsən, pul geri qayıdır.</div>
  <button class="btn" onclick="saveRule()">Yarat</button>`);
}
function rf(){const f=$('#r-freq').value;$('#r-w').hidden=f!=='weekly';$('#r-m').hidden=f!=='monthly'}
function saveRule(){
  const name=$('#r-name').value.trim(),amt=num($('#r-amt').value),freq=$('#r-freq').value;
  const days=[...document.querySelectorAll('#r-w input:checked')].map(i=>+i.value);
  const dom=Math.min(31,Math.max(1,parseInt($('#r-dom').value)||1));
  if(!name||amt===null||amt<=0)return alert('Ad və məbləği düzgün yaz.');
  if(freq==='weekly'&&!days.length)return alert('Ən azı bir gün seç.');
  const y=new Date();y.setDate(y.getDate()-1);
  S.rules.push({id:uid(),name,amt:r2(amt),cat:$('#r-cat').value,acc:$('#r-acc').value,bud:$('#r-bud').value,freq,days,dom,done:ymd(y)});
  runRules();save();closeS();render();
}
function openRuleEdit(id){
  const r=S.rules.find(x=>x.id===id);
  openS(`<h3>${esc(r.name)}</h3><p>${fmt(r.amt)} · ${sched(r)} · ${esc(r.cat)}</p><div class="note">Dayandırsan, əvvəlki əməliyyatlar qalır, yenisi əlavə olunmur.</div>
  <button class="btn alt" onclick="delRule('${id}')">Dayandır və sil</button>`);
}
function delRule(id){S.rules=S.rules.filter(r=>r.id!==id);save();closeS();render()}
function runRules(){
  let n=0;const today=ymd(new Date());
  S.rules.forEach(r=>{
    const d=new Date(r.done+'T12:00:00');let g=0;
    while(g++<800){
      d.setDate(d.getDate()+1);const k=ymd(d);if(k>today)break;
      r.done=k;
      const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const hit=r.freq==='daily'||(r.freq==='weekly'&&r.days.includes(d.getDay()))||(r.freq==='monthly'&&d.getDate()===Math.min(r.dom,last));
      const a=A(r.acc);if(!hit||!a)continue;
      const b=r.bud?A(r.bud):null,dl={[a.id]:-r.amt};if(b)dl[b.id]=-r.amt;
      post(r.name+' · '+a.name,'−',r.amt,dl,{kind:'spend',cat:r.cat,auto:1,rid:r.id,note:r.name,d:k===today?Date.now():d.getTime(),quiet:1});n++;
    }
  });
  if(n)S.tx.sort((x,y)=>y.d-x.d);
  if(S.rules.length)save();
  return n;
}
function toggleSort(){sortMode=!sortMode;render()}
function mv(id,d){const i=S.acc.findIndex(a=>a.id===id),j=i+d;if(j<0||j>=S.acc.length)return;[S.acc[i],S.acc[j]]=[S.acc[j],S.acc[i]];save();render()}
function render(){
  if(view==='tx')return renderTx();
  if(view==='stat')return renderStat();
  if(view==='set')return renderSet();
  const R=S.acc.filter(a=>!isB(a)),B=S.acc.filter(isB);
  const pos=total(R.filter(a=>a.balance>0)),neg=total(R.filter(a=>a.balance<0)),bud=B.reduce((s,a)=>s+Math.max(0,a.balance),0);
  const net=pos+neg-bud,dl=daysLeft();
  const dailyAccs=S.acc.filter(a=>isB(a)||a.daily);
  let h=seg()+`<div class="hero"><small>Hazırda sənin pulun</small>
  <div class="big num ${net<0?'neg':''}">${fmtS(net)}</div>
  <div class="sub"><div>Pul olan hesablar<b class="num">${fmt(pos)}</b></div>${neg<0?`<div>Borclar<b class="num neg">${fmtS(neg)}</b></div>`:''}${B.length?`<div>Xərc büdcəsi<b class="num neg">${fmt(bud)}</b></div>`:''}</div></div>`;
  if(dailyAccs.length){
    h+=`<div class="card daily"><h3>Gündəlik xərcləmə limiti</h3><p>Bu gün də daxil olmaqla ayın sonuna ${dl} gün qalıb</p>`;
    dailyAccs.forEach(a=>{const ok=a.balance>0;h+=`<div class="drow"><span>${esc(a.name)}<br><small class="num" style="color:var(--mute)">${fmtS(a.balance)} ${ok?'qalıb':'(qalmayıb)'}</small></span><span class="v num ${ok?'':'neg'}">${fmt(ok?a.balance/dl:0)}<small> / gün</small></span></div>`});
    h+=`</div>`;
  }
  h+=tplHtml();
  h+=`<h2>Hesablar <span>${S.acc.length>1?`<button onclick="toggleSort()">${sortMode?'Hazır':'Sırala'}</button>`:''}<button onclick="openAcc()">+ Yeni</button></span></h2><div class="card">`;
  h+=S.acc.map((a,i)=>`<div class="acc" ${sortMode?'':`onclick="openEdit('${a.id}')"`}><div><div class="n">${esc(a.name)}</div>${isB(a)?'<div class="t">xərc büdcəsi</div>':a.daily?'<div class="t">gündəlik hesablanır</div>':''}</div>${sortMode?`<div class="mv"><button onclick="mv('${a.id}',-1)" ${i===0?'disabled':''} aria-label="Yuxarı">▲</button><button onclick="mv('${a.id}',1)" ${i===S.acc.length-1?'disabled':''} aria-label="Aşağı">▼</button></div>`:`<div class="b num ${a.balance<0||isB(a)?'neg':''}">${fmtS(a.balance)}</div>`}</div>`).join('')
    ||`<div class="empty">Hələ hesab yoxdur. Məsələn: Nağd, ABB debet kart, Kredit, Aylıq xərc.</div>`;
  h+=`</div>`+rulesHtml()+`<h2>Son əməliyyatlar <button onclick="setView('tx')">Hamısı</button></h2><div class="card">`;
  h+=S.tx.slice(0,5).map(txRow).join('')||`<div class="empty">Hələ əməliyyat yoxdur.</div>`;
  h+=`</div>`;
  $('#app').innerHTML=h;
}

function openS(h){$('#box').innerHTML=h;$('#sheet').hidden=false}
function closeS(){$('#sheet').hidden=true}
const opts=(l,sel)=>l.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} (${isB(a)?'büdcə ':a.balance<0?'borc ':''}${isB(a)?fmtS(a.balance):fmt(a.balance)})</option>`).join('');
const kindOf=a=>isB(a)?'b':a.balance<0?'n':'p';
const kindSel=k=>`<label>Hesabın növü</label><select id="f-kind"><option value="p" ${k==='p'?'selected':''}>Pulum var</option><option value="n" ${k==='n'?'selected':''}>Borc / xərc (qırmızı)</option><option value="b" ${k==='b'?'selected':''}>Xərc büdcəsi (ümumi puldan çıxılır)</option></select>
<div class="note">Xərc büdcəsi: ay üçün xərcə ayırdığın məbləğ. Ümumi puldan çıxılır və gündəlik limit avtomatik hesablanır.</div>`;

function openAcc(){
  openS(`<h3>Yeni hesab</h3>
  <label>Ad</label><input id="f-name" placeholder="Nağd, ABB debet kart, Aylıq xərc">
  <label>Məbləğ</label>${amtF('f-bal','')}${kindSel('p')}
  <label class="chk"><input type="checkbox" id="f-daily"> Gündəlik limit göstər (büdcə üçün həmişə göstərilir)</label>
  <button class="btn" onclick="saveAcc()">Yarat</button>`);
}
function readAcc(){
  const name=$('#f-name').value.trim(),b=num($('#f-bal').value||0);
  if(!name||b===null)return null;
  const k=$('#f-kind').value;
  return{name,balance:r2(k==='n'?-Math.abs(b):Math.abs(b)),daily:$('#f-daily').checked,kind:k==='b'?'b':undefined};
}
function saveAcc(){
  const d=readAcc();if(!d)return alert('Ad və məbləği düzgün yaz.');
  S.acc.push({id:uid(),...d});save();closeS();render();
}
function openEdit(id){
  const a=A(id);
  openS(`<h3>${esc(a.name)}</h3><label>Ad</label><input id="f-name" value="${esc(a.name)}">
  <label>Cari məbləğ</label>${amtF('f-bal',Math.abs(a.balance))}${kindSel(kindOf(a))}
  <label class="chk"><input type="checkbox" id="f-daily" ${a.daily?'checked':''}> Gündəlik limit göstər (büdcə üçün həmişə göstərilir)</label>
  <button class="btn" onclick="saveEdit('${id}')">Yadda saxla</button>
  <button class="btn alt" onclick="delAcc('${id}')">Hesabı sil</button>`);
}
function saveEdit(id){
  const d=readAcc();if(!d)return alert('Ad və məbləği düzgün yaz.');
  const old=A(id).name;Object.assign(A(id),d);
  if(old!==d.name)S.tx.forEach(t=>{if(t.deltas&&id in t.deltas){if(t.note===undefined&&txKind(t)!=='move')t.note=noteOf(t);t.label=mkLabel(t)}});
  save();closeS();render();
}
function delAcc(id){
  const a=A(id);if(!a)return;
  const nt=S.tx.filter(t=>t.deltas&&id in t.deltas).length,tp=S.tpls.filter(t=>t.acc===id).length,rl=S.rules.filter(r=>r.acc===id).length;
  const m=[`"${a.name}" hesabı silinsin?`];
  if(a.balance)m.push(`• Qalığı (${fmtS(a.balance)}) ümumi cəmdən çıxacaq`);
  if(nt)m.push(`• ${nt} əməliyyat tarixçədə qalacaq, amma artıq bu hesaba bağlı olmayacaq`);
  if(tp)m.push(`• ${tp} şablon silinəcək`);
  if(rl)m.push(`• ${rl} təkrarlanan xərc silinəcək`);
  if(!confirm(m.join('\n')))return;
  S.tpls=S.tpls.filter(t=>t.acc!==id);S.tpls.forEach(t=>{if(t.bud===id)t.bud=''});
  S.rules=S.rules.filter(r=>r.acc!==id);S.rules.forEach(r=>{if(r.bud===id)r.bud=''});
  ['from','to','bud'].forEach(k=>{if(S.last[k]===id)delete S.last[k]});
  S.acc=S.acc.filter(x=>x.id!==id);save();closeS();render();
}

// ---- Tez əlavə (şablonlar)
const tplHtml=()=>{
  const hd=`<h2>Tez əlavə <span>${S.tpls.length?`<button onclick="tplEd=!tplEd;render()">${tplEd?'Hazır':'Dəyişdir'}</button>`:''}<button onclick="openTpl()">+ Yeni</button></span></h2>`;
  if(!S.tpls.length)return hd+`<div class="card"><div class="empty">Tez-tez etdiyin xərci (məs. qəhvə 3.50 ₼) bura əlavə et, bir toxunuşla yazılsın.</div></div>`;
  return hd+`<div class="tpls ${tplEd?'ed':''}">`+S.tpls.map(t=>{const a=A(t.acc);return `<button class="tpl" onclick="${tplEd?`openTpl('${t.id}')`:`quickAdd('${t.id}')`}"><b>${esc(t.name)}</b><span class="num">${fmt(t.amt)}</span><small>${esc(t.cat)}${a?' · '+esc(a.name):''}</small></button>`}).join('')+`</div>`+(tplEd?`<div class="note" style="margin:-4px 4px 10px">Dəyişmək üçün şablona toxun.</div>`:'');
};
function openTpl(id){
  const R=S.acc.filter(a=>!isB(a)),B=S.acc.filter(isB);
  if(!R.length)return alert('Əvvəlcə pul hesabı yarat.');
  const t=id?S.tpls.find(x=>x.id===id):null;
  openS(`<h3>${t?'Şablonu dəyiş':'Yeni şablon'}</h3>
  <label>Ad</label><input id="t-name" value="${t?esc(t.name):''}" placeholder="Məs: Qəhvə, Gediş haqqı">
  <label>Məbləğ</label>${amtF('t-amt',t?t.amt:'','3.50')}
  <label>Kateqoriya</label><select id="t-cat">${S.cats.map(c=>`<option ${t&&c===t.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <label>Hansı hesabdan</label><select id="t-acc">${opts(R,t&&t.acc)}</select>
  <label>Xərc büdcəsindən də çıx</label><select id="t-bud"><option value="">Yox</option>${opts(B,t?t.bud:(B[0]||{}).id)}</select>
  <div class="note">Şablona toxunanda xərc bu gün üçün dərhal əlavə olunur. 5 saniyə ərzində "Ləğv et" ilə geri ala bilərsən.</div>
  <button class="btn" onclick="saveTpl('${id||''}')">${t?'Yadda saxla':'Yarat'}</button>${t?`<button class="btn alt" onclick="delTpl('${id}')">Sil</button>`:''}`);
}
function saveTpl(id){
  const name=$('#t-name').value.trim(),amt=num($('#t-amt').value);
  if(!name||amt===null||amt<=0)return alert('Ad və məbləği düzgün yaz.');
  const d={name,amt:r2(amt),cat:$('#t-cat').value,acc:$('#t-acc').value,bud:$('#t-bud').value};
  if(id)Object.assign(S.tpls.find(x=>x.id===id),d);else S.tpls.push({id:uid(),...d});
  save();closeS();render();
}
function delTpl(id){
  if(!confirm('Şablon silinsin? Əvvəlki əməliyyatlar qalır.'))return;
  S.tpls=S.tpls.filter(x=>x.id!==id);if(!S.tpls.length)tplEd=false;save();closeS();render();
}
function quickAdd(id){
  const t=S.tpls.find(x=>x.id===id),a=t&&A(t.acc);
  if(!a)return alert('Bu şablonun hesabı silinib. Şablonu dəyişib hesab seç.');
  const b=t.bud?A(t.bud):null,d={[a.id]:-t.amt};if(b)d[b.id]=-t.amt;
  const x=post(`${t.name} · ${a.name}${b?' → '+b.name:''}`,'−',t.amt,d,{kind:'spend',cat:t.cat,note:t.name});
  toast(`${esc(t.name)} · ${fmt(t.amt)} əlavə olundu`,x.id);
}
let tT;
function toast(m,id){
  const e=$('#toast');e.innerHTML=`<span>${m}</span><button onclick="undoTx('${id}')">Ləğv et</button>`;e.hidden=false;
  clearTimeout(tT);tT=setTimeout(()=>{e.hidden=true},5000);
}
function undoTx(id){clearTimeout(tT);$('#toast').hidden=true;rmTx(id)}

// ---- Formada yadda saxlama: son hesab/kateqoriya/büdcə + qeydə görə kateqoriya
let NM=[];
const DEF={add:'Əlavə',spend:'Xərc'};
function noteOf(t){
  if(t.note!==undefined)return t.note;
  const k=txKind(t);if(k==='move')return '';
  const l=String(t.label),i=l.lastIndexOf(' · '),n=(i>0?l.slice(0,i):l).trim();
  return n===DEF[k]?'':n;
}
function mkLabel(t){
  const k=txKind(t),p=txParts(t),nm=id=>A(id).name;
  if(k==='move')return p.from&&p.to?`${nm(p.from)} → ${nm(p.to)}`:t.label;
  const note=noteOf(t);
  if(k==='add')return p.to?`${note||'Əlavə'} · ${nm(p.to)}`:t.label;
  return p.from?`${note||'Xərc'} · ${nm(p.from)}${p.bud?' → '+nm(p.bud):''}`:t.label;
}
function buildNotes(){
  const seen=new Set();NM=[];
  [...S.tx].sort((a,b)=>b.d-a.d).forEach(t=>{
    if(txKind(t)!=='spend')return;
    const raw=noteOf(t),n=fold(raw).trim();
    if(!n||raw==='Xərc'||seen.has(n))return;
    seen.add(n);NM.push({n,raw,cat:catOf(t)});
  });
}
function noteCat(v){
  const q=fold(v).trim();if(!q)return null;
  let m=NM.find(x=>x.n===q);if(!m&&q.length>=3)m=NM.find(x=>x.n.startsWith(q));
  return m?m.cat:null;
}
function onNote(el){
  const sel=$('#f-catg');if(!sel||sel.dataset.m)return;
  const c=noteCat(el.value);
  if(c&&c!==sel.value&&[...sel.options].some(o=>o.value===c)){sel.value=c;$('#f-hint').hidden=false}
}
function onCatManual(el){el.dataset.m=1;$('#f-hint').hidden=true}

function openOp(kind){
  if(!S.acc.length)return alert('Əvvəlcə hesab yarat.');
  const R=S.acc.filter(a=>!isB(a)),B=S.acc.filter(isB);
  const T=[['spend','Xərc'],['add','Əlavə et'],['move','Transfer']];
  let h=`<div class="tabs">${T.map(t=>`<button class="${t[0]===kind?'on':''}" onclick="openOp('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
  if(kind==='add')h+=`<label>Hansı hesaba</label><select id="f-to">${opts(S.acc,S.last.to)}</select>
    <label>Məbləğ</label>${amtF('f-amt','')}<label>Qeyd (istəyə bağlı)</label><input id="f-note">
    <div class="note">Xərc büdcəsinə əlavə etsən, həmin məbləğ ümumi puldan çıxılır və gündəlik limit artır.</div>`;
  if(kind==='spend'){
    if(!R.length)return alert('Xərc etmək üçün pul hesabı lazımdır.');
    buildNotes();
    const L=S.last,bs=B.some(a=>a.id===L.bud)?L.bud:L.bud===''?'':(B[0]||{}).id;
    h+=`<label>Hansı hesabdan</label><select id="f-from">${opts(R,L.from)}</select>
    <label>Kateqoriya</label><select id="f-catg" onchange="onCatManual(this)">${S.cats.map(c=>`<option ${c===L.cat?'selected':''}>${c}</option>`).join('')}</select>
    <div class="note" id="f-hint" hidden>Kateqoriya əvvəlki eyni qeydə görə seçildi.</div>
    <label>Xərc büdcəsindən də çıx</label><select id="f-cat"><option value="">Yox</option>${opts(B,bs)}</select>
    <label>Məbləğ</label>${amtF('f-amt','')}<label>Qeyd (istəyə bağlı)</label><input id="f-note" list="f-notes" autocomplete="off" oninput="onNote(this)" onchange="onNote(this)"><datalist id="f-notes">${NM.slice(0,40).map(x=>`<option value="${esc(x.raw)}">`).join('')}</datalist>
    <label class="chk"><input type="checkbox" id="f-tpl"> Tez əlavə üçün şablon kimi saxla</label>
    <div class="note">Büdcə seçsən (məs. Aylıq xərc), məbləğ ondan da azalır. Hesabda pul çatmasa, qalıq qırmızı olur.</div>`;}
  if(kind==='move'){
    if(R.length<2)return alert('Transfer üçün ən azı iki hesab lazımdır (büdcə hesabları transferdə iştirak etmir).');
    h+=`<label>Haradan</label><select id="f-from">${opts(R)}</select><label>Hara</label><select id="f-to">${opts(R,R[1].id)}</select>
    <label>Məbləğ</label>${amtF('f-amt','')}
    <div class="note">Göndərən hesabda pul azdırsa, çatmayan hissə qırmızı qalıq kimi görünür. Kreditə ödəniş üçün də transferdən istifadə et.</div>`;}
  h+=`<label>Tarix</label><input id="f-date" type="date" value="${ymd(new Date())}" max="${ymd(new Date())}"><button class="btn" onclick="doOp('${kind}')">Təsdiq et</button>`;
  openS(h);
}
function post(label,sign,amt,deltas,x={}){
  for(const id in deltas){const a=A(id);if(a)a.balance=r2(a.balance+deltas[id])}
  const tx={id:uid(),d:x.d||Date.now(),label,sign,amt,deltas,kind:x.kind,cat:x.cat,auto:x.auto,rid:x.rid,note:x.note};S.tx.unshift(tx);
  if(!x.quiet){S.tx.sort((p,q)=>q.d-p.d);save();closeS();render()}
  return tx;
}
function doOp(kind){
  const amt=num($('#f-amt').value);
  if(amt===null||amt<=0)return alert('Məbləği düzgün yaz.');
  if($('#f-date').value>ymd(new Date()))return alert('Gələcək tarixə əməliyyat yazmaq olmaz.');
  const note=$('#f-note')?$('#f-note').value.trim():'',D=dateTs($('#f-date').value);
  if(kind==='add'){const a=A($('#f-to').value);S.last={...S.last,to:a.id};post(`${note||'Əlavə'} · ${a.name}`,'+',amt,{[a.id]:amt},{kind:'add',d:D,note})}
  if(kind==='spend'){
    const a=A($('#f-from').value),c=$('#f-cat').value?A($('#f-cat').value):null;
    const d={[a.id]:-amt};if(c)d[c.id]=-amt;
    S.last={...S.last,from:a.id,cat:$('#f-catg').value,bud:c?c.id:''};
    if($('#f-tpl').checked)S.tpls.push({id:uid(),name:note||$('#f-catg').value,amt,cat:$('#f-catg').value,acc:a.id,bud:c?c.id:''});
    post(`${note||'Xərc'} · ${a.name}${c?' → '+c.name:''}`,'−',amt,d,{kind:'spend',cat:$('#f-catg').value,d:D,note});
  }
  if(kind==='move'){
    const f=A($('#f-from').value),t=A($('#f-to').value);
    if(f.id===t.id)return alert('Fərqli hesablar seç.');
    post(`${f.name} → ${t.name}`,'',amt,{[f.id]:-amt,[t.id]:amt},{kind:'move',d:D});
  }
}
const dateTs=v=>{if(!v||v===ymd(new Date()))return Date.now();const[y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12).getTime()};
function txParts(t){
  const ids=Object.keys(t.deltas).filter(k=>A(k)),k=txKind(t);
  if(k==='add')return{to:ids[0]};
  if(k==='spend')return{from:ids.find(i=>!isB(A(i))),bud:ids.find(i=>isB(A(i)))};
  return{from:ids.find(i=>t.deltas[i]<0),to:ids.find(i=>t.deltas[i]>0)};
}
function openTxEdit(id){
  const t=S.tx.find(x=>x.id===id),k=txKind(t),p=txParts(t);
  const R=S.acc.filter(a=>!isB(a)),B=S.acc.filter(isB);
  const gone=Object.keys(t.deltas).some(x=>!A(x)),mx=ymd(new Date(Math.max(Date.now(),t.d)));
  let h=`<h3>Əməliyyatı redaktə et</h3>${k==='move'?`<div class="note">${esc(t.label)}</div>`:`<label>Qeyd (istəyə bağlı)</label><input id="e-label" value="${esc(noteOf(t))}">`}
  <label>Məbləğ</label>${amtF('e-amt',t.amt)}`;
  if(k==='add')h+=`<label>Hesab</label><select id="e-to">${opts(S.acc,p.to)}</select>`;
  if(k==='spend')h+=`<label>Hansı hesabdan</label><select id="e-from">${opts(R,p.from)}</select>
    <label>Kateqoriya</label><select id="e-cat">${S.cats.map(c=>`<option ${c===catOf(t)?'selected':''}>${c}</option>`).join('')}</select>
    <label>Xərc büdcəsindən də çıx</label><select id="e-bud"><option value="">Yox</option>${opts(B,p.bud)}</select>`;
  if(k==='move')h+=`<label>Haradan</label><select id="e-from">${opts(R,p.from)}</select><label>Hara</label><select id="e-to">${opts(R,p.to)}</select>`;
  h+=`<label>Tarix</label><input id="e-date" type="date" value="${ymd(new Date(t.d))}" max="${mx}">
  <div class="note">Dəyişikliklər hesablara avtomatik tətbiq olunur.${gone?' Bu əməliyyatın hesabı silinib: yadda saxlasan, seçdiyin hesaba tətbiq olunacaq.':''}</div>
  <button class="btn" onclick="saveTx('${id}')">Yadda saxla</button><button class="btn alt" onclick="delTx('${id}')">Sil</button>`;
  openS(h);
}
function saveTx(id){
  const t=S.tx.find(x=>x.id===id),k=txKind(t),amt=num($('#e-amt').value),g=x=>$(x)?$(x).value:'';
  if(amt===null||amt<=0)return alert('Məbləği düzgün yaz.');
  const dv=g('#e-date');
  if(dv&&dv!==ymd(new Date(t.d))&&dv>ymd(new Date()))return alert('Gələcək tarix seçmək olmaz.');
  let nd;
  if(k==='add')nd={[g('#e-to')]:amt};
  else if(k==='spend'){nd={[g('#e-from')]:-amt};if(g('#e-bud'))nd[g('#e-bud')]=-amt}
  else{if(g('#e-from')===g('#e-to'))return alert('Fərqli hesablar seç.');nd={[g('#e-from')]:-amt,[g('#e-to')]:amt}}
  for(const x in t.deltas){const a=A(x);if(a)a.balance=r2(a.balance-t.deltas[x])}
  for(const x in nd){const a=A(x);if(a)a.balance=r2(a.balance+nd[x])}
  t.deltas=nd;t.amt=r2(amt);
  if(k!=='move')t.note=g('#e-label').trim();
  if(k==='spend')t.cat=g('#e-cat');
  if(dv&&dv!==ymd(new Date(t.d)))t.d=dateTs(dv);
  t.label=mkLabel(t);
  S.tx.sort((x,y)=>y.d-x.d);save();closeS();render();
}
function delTx(id){
  if(!confirm('Əməliyyat silinsin və hesablar geri qaytarılsın?'))return;
  rmTx(id);
}
function rmTx(id){
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  for(const k in t.deltas){const a=A(k);if(a)a.balance=r2(a.balance-t.deltas[k])}
  S.tx=S.tx.filter(x=>x.id!==id);save();closeS();render();
}

function exportD(){
  const j=JSON.stringify(S);
  (navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert('Nüsxə kopyalandı. Qeydlər və ya mesajlar tətbiqində saxla.')).catch(()=>prompt('Bu mətni kopyala və saxla:',j));
}
function importD(){
  const j=prompt('Əvvəl aldığın nüsxəni bura yapışdır (cari data əvəz olunacaq):');
  if(!j)return;
  try{const d=JSON.parse(j);if(!Array.isArray(d.acc)||!Array.isArray(d.tx))throw 0;S=norm(d);save();render()}catch(e){alert('Nüsxə oxunmadı.')}
}

// ---- Sürüşdürmə jestləri
// 1) səhifələr arası: sola → növbəti, sağa → əvvəlki (Ana səhifə · Əməliyyatlar · Statistika · ⚙︎)
// 2) Statistikada diaqram sahəsində: sağa → əvvəlki dövr, sola → növbəti dövr
(function(){
  let x0=0,y0=0,t0=0,tg=null,on=false;
  addEventListener('touchstart',e=>{
    const t=e.touches[0];on=e.touches.length===1&&$('#sheet').hidden&&t.clientX>16&&!e.target.closest('input,select,textarea');
    x0=t.clientX;y0=t.clientY;t0=Date.now();tg=e.target;
  },{passive:true});
  addEventListener('touchend',e=>{
    if(!on)return;on=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-t0>700)return;
    if(view==='stat'&&tg.closest&&tg.closest('[data-sw="p"]')){stepP(dx<0?1:-1);return}
    const i=VW.indexOf(view)+(dx<0?1:-1);
    if(i>=0&&i<VW.length)setView(VW[i]);
  },{passive:true});
  // alt pəncərəni (sheet) aşağı çəkib bağlamaq
  const b=$('#box');let sy=0,sx=0,dy=0,ok=false;
  b.addEventListener('touchstart',e=>{const t=e.touches[0];ok=b.scrollTop<=0&&e.touches.length===1&&!e.target.closest('input,select,textarea');sy=t.clientY;sx=t.clientX;dy=0;b.style.transition='none'},{passive:true});
  b.addEventListener('touchmove',e=>{if(!ok)return;const t=e.touches[0];dy=t.clientY-sy;if(dy>12&&dy>Math.abs(t.clientX-sx))b.style.transform='translateY('+dy+'px)';else b.style.transform=''},{passive:true});
  b.addEventListener('touchend',()=>{if(!ok)return;ok=false;const c=dy>110;b.style.transition='transform .18s';b.style.transform='';if(c)closeS();setTimeout(()=>{b.style.transition=''},200)},{passive:true});
})();

runRules();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&runRules())render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
